munity-review</tspan></text><svg x="80" y="1604" xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194"><title>community-review / Wireframe</title><rect width="834" height="1194" rx="28" fill="#F5F5F3"/><text x="117.0" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">9:41</tspan></text><text x="766" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="766" dy="0">●  ▰</tspan></text><text x="117.0" y="75" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">‹  Back</tspan></text><text x="117.0" y="119" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="117.0" dy="0">Share with the community?</tspan></text><text x="117.0" y="159.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0"></tspan></text><text x="117.0" y="213.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">Everything you share will be verified by an admin before it appears in the</tspan><tspan x="117.0" dy="19.599999999999998">community. You’ll receive an app notification and email when there is an</tspan><tspan x="117.0" dy="19.599999999999998">update.</tspan></text><text x="117.0" y="295.8" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">This prototype previews the review process. It sends no messages or emails.</tspan></text><rect x="117.0" y="325.4" width="600" height="52" rx="16" fill="#333333"/><text x="133.0" y="358.4" fill="#FFFFFF" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Okay</tspan></text><rect x="117.0" y="389.4" w