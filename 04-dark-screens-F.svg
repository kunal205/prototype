nt-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="32.0" dy="0">＋ Add media</tspan><tspan x="32.0" dy="19.599999999999998">Send</tspan></text><rect x="0" y="886" width="390" height="76" fill="#292334"/><text x="14.0" y="929" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700"><tspan x="14.0" dy="0">Home</tspan></text><text x="111.5" y="929" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700"><tspan x="111.5" dy="0">Stories</tspan></text><text x="209.0" y="929" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700"><tspan x="209.0" dy="0">Community</tspan></text><text x="306.5" y="929" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700"><tspan x="306.5" dy="0">Shop</tspan></text></svg><text x="80" y="1182" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400"><tspan x="80" dy="0">F / community · Enter: shared layout, 360ms spring · Exit:</tspan><tspan x="80" dy="16.799999999999997">reverse. Loading: shaped skeleton. Empty: explanatory copy</tspan><tspan x="80" dy="16.799999999999997">+ action. Error: inline retry. Reduced: 120ms dissolve.</tspan></text><text x="550" y="166" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="550" dy="0">app-feedback</tspan></text><svg x="550" y="190" xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>app-feedback / Dark</title><rect width="390" height="844" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" d