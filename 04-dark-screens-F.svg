akarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="344.0" dy="0">→</tspan></text><text x="32.0" y="216.0" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Choose a photo</tspan></text><rect x="16.0" y="259.0" width="358" height="58" rx="16" fill="#292334" stroke="#44394F"/><text x="344.0" y="283.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="344.0" dy="0">→</tspan></text><text x="32.0" y="283.0" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Choose a file</tspan></text><text x="16.0" y="347.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Review your selection before sending.</tspan></text><rect x="16.0" y="376.6" width="358" height="52" rx="16" fill="#B99ADD"/><text x="32.0" y="409.6" fill="#241730" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Done</tspan></text><rect x="16.0" y="440.6" width="358" height="52" rx="16" fill="#292334"/><text x="32.0" y="473.6" fill="#B99ADD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Cancel</tspan></text></svg><text x="1020" y="1064" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400"><tspan x="1020" dy="0">F / attachments · Enter: sheet rise, 360ms spring · Exit:</tspan><tspan x="1020" dy="16.799999999999997">reverse. Loading: shaped skeleton. Empty: explanatory copy</tspan><tspan x="1020" dy="16.799999999999997">+ action. Error: inline retry. Reduced: 120ms dissolve.</tspan></text><text x="1490" y="166" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="1490" dy="0">submitted</tspan></text><svg x="1490" y="190" xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>submitted / Dark</title><rect width="390" height="844" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Waiting for admin review</tspan></text><text x="16.0" y="159.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Your sample submission is saved on this</tspan><tspan x="16.0" dy="19.599999999999998">device.</tspan></text><text x="16.0" y="232.6" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">The admin review and email are simulated in</tspan><tspan x="16.0" dy="19.599999999999998">this prototype.</tspan></text><rect x="16.0" y="281.8" width="358" height="52" rx="16" fill="#B99ADD"/><text x="32.0" y="314.8" fill="#241730" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Back to community</tspan></text></svg><text x="1490" y="1064" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400"><tspan x="1490" dy="0">F / submitted · Enter: shared layout, 360ms spring · Exit:</tspan><tspan x="1490" dy="16.799999999999997">reverse. Loading: shaped skeleton. Empty: explanatory copy</tspan><tspan x="1490" dy="16.799999999999997">+ action. Error: inline retry. Reduced: 120ms dissolve.</tspan></text><text x="80" y="1348" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="80" dy="0">community-review</tspan></text><svg x="80" y="1372" xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>community-review / Dark</title><rect width="390" height="844" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Share with the community?</tspan></text><text x="16.0" y="159.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0"></tspan></text><text x="16.0" y="213.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Everything you share will be verified by an</tspan><tspan x="16.0" dy="19.599999999999998">admin before it appears in the community.</tspan><tspan x="16.0" dy="19.599999999999998">You’ll receive an app notification and email</tspan><tspan x="16.0" dy="19.599999999999998">when there is an update.</tspan></text><text x="16.0" y="315.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">This prototype previews the review process. It</tspan><tspan x="16.0" dy="19.599999999999998">sends no messages or emails.</tspan></text><rect x="16.0" y="364.59999999999997" width="358" height="52" rx="16" fill="#B99ADD"/><text x="32.0" y="397.59999999999997" fill="#241730" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Okay</tspan></text><rect x="16.0" y="428.59999999999997" width="358" height="52" rx="16" fill="#292334"/><text x="32.0" y="461.59999999999997" fill="#B99ADD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Cancel</tspan></text></svg><text x="80" y="2246" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400"><tspan x="80" dy="0">F / community-review · Enter: sheet rise, 360ms spring ·</tspan><tspan x="80" dy="16.799999999999997">Exit: reverse. Loading: shaped skeleton. Empty: explanatory</tspan><tspan x="80" dy="16.799999999999997">copy + action. Error: inline retry. Reduced: 120ms</tspan><tspan x="80" dy="16.799999999999997">dissolve.</tspan></text></svg>