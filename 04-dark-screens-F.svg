<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="2584" viewBox="0 0 1960 2584"><rect width="1960" height="2584" fill="#EEEBE7"/><text x="80" y="80" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="36" font-weight="700"><tspan x="80" dy="0">F. Community &amp; Messaging</tspan></text><text x="80" y="127" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="400"><tspan x="80" dy="0">Little Legacy / Dark / 390px / connected screen inventory</tspan></text><text x="80" y="166" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="80" dy="0">community</tspan></text><svg x="80" y="190" xmlns="http://www.w3.org/2000/svg" width="390" height="962" viewBox="0 0 390 962"><title>community / Dark</title><rect width="390" height="962" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Little Legacy Community</tspan></text><text x="16.0" y="159.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Little moments, shared together.</tspan></text><svg x="16.0" y="193.0" width="358" height="170" viewBox="0 0 300 200" fill="none" aria-hidden="true"><circle cx="115" cy="70" r="28" fill="#B99ADD" opacity=".35"/><circle cx="185" cy="87" r="23" fill="#B99ADD" opacity=".6"/><path d="M64 159c0-