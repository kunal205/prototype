<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>remove-child / Wireframe</title><rect width="390" height="844" rx="28" fill="#F5F5F3"/><text x="16.0" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Remove Maya’s profile?</tspan></text><text x="16.0" y="159.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">This action applies to Maya.</tspan></text><text x="16.0" y="213.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Review the effect on saved progress before</tspan><tspan x="16.0" dy="19.599999999999998">confirming. Final retention wording requires</tspan><tspan x="16.0" dy="19.599999999999998">approval.</tspan></text><rect x="16.0" y="281.8" width="358" height="52" rx="16" fill="#333333"/><text x="32.0" y="314.8" fill="#FFFFFF" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Keep Maya’s profile</tspan></text><rect x="16.0" y="345.8" width="358" height="52" rx="16" fill="#FFFFFF"/><text x="32.0" y="378.8" fill="#333333" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Remove Maya’s profile</tspan></text></svg>