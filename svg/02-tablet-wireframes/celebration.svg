<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194"><title>celebration / Wireframe</title><rect width="834" height="1194" rx="28" fill="#F5F5F3"/><text x="117.0" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">9:41</tspan></text><text x="766" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="766" dy="0">●  ▰</tspan></text><text x="117.0" y="75" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">‹  Back</tspan></text><text x="117.0" y="119" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="117.0" dy="0">A little growth, together.</tspan></text><text x="117.0" y="159.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">Every moment you share makes a difference.</tspan></text><svg x="117.0" y="193.0" width="600" height="170" viewBox="0 0 300 200" fill="none" aria-hidden="true"><circle cx="150" cy="94" r="77" fill="#333333" opacity=".06"/><path d="M118 145h64l-9 40h-46z" fill="#333333" opacity=".18"/><g class="grow"><path d="M150 147V65" stroke="#333333" stroke-width="5" stroke-linecap="round"/><path d="M149 113c-34 0-48-16-43-39 27 0 43 14 43 39Z" fill="#333333" opacity=".65"/><path d="M151 90c0-29 17-45 43-41 0 26-17 43-43 41Z" fill="#333333" opacity=".85"/><path d="M151 132c25 0 40-13 37-33-24 0-38 12-37 33Z" fill="#333333" opacity=".45"/></g><rect x="114" y="143" width="72" height="10" rx="5" fill="#333333" opacity=".75"/></svg><text x="117.0" y="397.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">One completed activity = one growth stage, adding one new leaf.</tspan></text><text x="117.0" y="440.6" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">One completed activity adds one growth stage.</tspan></text><rect x="117.0" y="470.20000000000005" width="600" height="52" rx="16" fill="#333333"/><text x="133.0" y="503.20000000000005" fill="#FFFFFF" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Continue to feedback</tspan></text></svg>