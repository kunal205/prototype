<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194"><title>remove-child / Wireframe</title><rect width="834" height="1194" rx="28" fill="#F5F5F3"/><text x="117.0" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">9:41</tspan></text><text x="766" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="766" dy="0">●  ▰</tspan></text><text x="117.0" y="75" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">‹  Back</tspan></text><text x="117.0" y="119" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="117.0" dy="0">Remove Maya’s profile?</tspan></text><text x="117.0" y="159.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">This action applies to Maya.</tspan></text><text x="117.0" y="213.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">Review the effect on saved progress before confirming. Final retention</tspan><tspan x="117.0" dy="19.599999999999998">wording requires approval.</tspan></text><rect x="117.0" y="262.2" width="600" height="52" rx="16" fill="#333333"/><text x="133.0" y="295.2" fill="#FFFFFF" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Keep Maya’s profile</tspan></text><rect x="117.0" y="326.2" width="600" height="52" rx="16" fill="#FFFFFF"/><text x="133.0" y="359.2" fill="#333333" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Remove Maya’s profile</tspan></text></svg>