<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194"><title>verification / Wireframe</title><rect width="834" height="1194" rx="28" fill="#F5F5F3"/><text x="117.0" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">9:41</tspan></text><text x="766" y="30" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="766" dy="0">●  ▰</tspan></text><text x="117.0" y="75" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="117.0" dy="0">‹  Back</tspan></text><text x="117.0" y="119" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="117.0" dy="0">Check your inbox</tspan></text><text x="117.0" y="159.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">Enter the code sent to your email.</tspan></text><rect x="117.0" y="192.0" width="600" height="68.0" rx="16" fill="#FFFFFF" stroke="#DCDCD8"/><text x="133.0" y="216.0" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="400"><tspan x="133.0" dy="0">Verification code</tspan></text><text x="133.0" y="241.4" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="133.0" dy="0">6-digit code</tspan></text><rect x="117.0" y="269.0" width="600" height="58" rx="16" fill="#FFFFFF" stroke="#DCDCD8"/><text x="687.0" y="293.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="687.0" dy="0">→</tspan></text><text x="133.0" y="293.0" fill="#232323" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Send a new code</tspan></text><text x="117.0" y="357.0" fill="#646464" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="117.0" dy="0">Check your spam folder if the email has not arrived.</tspan></text><rect x="117.0" y="386.6" width="600" height="52" rx="16" fill="#333333"/><text x="133.0" y="419.6" fill="#FFFFFF" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="133.0" dy="0">Verify email</tspan></text></svg>