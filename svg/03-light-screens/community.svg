<svg xmlns="http://www.w3.org/2000/svg" width="390" height="962" viewBox="0 0 390 962"><title>community / Light</title><rect width="390" height="962" rx="28" fill="#FAF8F4"/><text x="16.0" y="30" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Little Legacy Community</tspan></text><text x="16.0" y="159.4" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Little moments, shared together.</tspan></text><svg x="16.0" y="193.0" width="358" height="170" viewBox="0 0 300 200" fill="none" aria-hidden="true"><circle cx="115" cy="70" r="28" fill="#7450AA" opacity=".35"/><circle cx="185" cy="87" r="23" fill="#7450AA" opacity=".6"/><path d="M64 159c0-75 100-75 100 0m-10 0c0-52 75-52 75 0" stroke="#7450AA" stroke-width="8" stroke-linecap="round" opacity=".5"/></svg><rect x="16.0" y="376.0" width="358" height="90.4" rx="16" fill="#FFFFFF" stroke="#E6E0EC"/><text x="32.0" y="400.0" fill="#282133" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="32.0" dy="0">Little Legacy team</tspan></text><text x="32.0" y="428.2" fill="#6D6479" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="32.0" dy="0">Small wins deserve a little celebration.</tspan><tspan x="32.0" dy="19.599999999999998">What did your little one discover today?</tspan></text><svg x="16.0" y="476.4" width="358" h