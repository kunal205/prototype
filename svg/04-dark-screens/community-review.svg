<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>community-review / Dark</title><rect width="390" height="844" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Share with the community?</tspan></text><text x="16.0" y="159.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0"></tspan></text><text x="16.0" y="213.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Everything you share will be verified by an</tspan><tspan x="16.0" dy="19.599999999999998">admin before it appears in the community.</tspan><tspan x="16.0" dy="19.599999999999998">You’ll receive an app notification and email</tspan><tspan x="16.0" dy="19.599999999999998">when there is an update.</tspan></text><text x="16.0" y="315.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">This prototype previews the review process. It</tspan><tspan x="16.0" dy="19.599999999999998">sends no messages or emails.</tspan></text><rect x="16.0" y="364.59999999999997" width="358" height="52" rx="16" fill="#B99ADD"/><text x="32.0" y="397.59999999999997" fill="#241730" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Okay</tspan></text><rect x="16.0" y="428.59999999999997" width="358" height="52" rx="16" fill="#292334"/><text x="32.0" y="461.59999999999997" fill="#B99ADD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Cancel</tspan></text></svg>