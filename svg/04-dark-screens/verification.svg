<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>verification / Dark</title><rect width="390" height="844" rx="28" fill="#1D1926"/><text x="16.0" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">9:41</tspan></text><text x="322" y="30" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="322" dy="0">●  ▰</tspan></text><text x="16.0" y="75" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="16.0" dy="0">‹  Back</tspan></text><text x="16.0" y="119" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26" font-weight="700"><tspan x="16.0" dy="0">Check your inbox</tspan></text><text x="16.0" y="159.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="16.0" dy="0">Enter the code sent to your email.</tspan></text><rect x="16.0" y="192.0" width="358" height="68.0" rx="16" fill="#292334" stroke="#44394F"/><text x="32.0" y="216.0" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="400"><tspan x="32.0" dy="0">Verification code</tspan></text><text x="32.0" y="241.4" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="32.0" dy="0">6-digit code</tspan></text><rect x="16.0" y="269.0" width="358" height="58" rx="16" fill="#292334" stroke="#44394F"/><text x="344.0" y="293.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="344.0" dy="0">→</tspan></text><text x="32.0" y="293.0" fill="#F6F1FC" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="32.0" dy="0">Send a new code</tspan></text><text x="16.0" y="357.0" fill="#C1B5CD" font-family="Plus Jakarta Sans, Arial, sans-s